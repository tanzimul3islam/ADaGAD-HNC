name: adagad_hnc_medium
encoder:
  type: gat
  hidden_dim: 96
  num_layers: 2
  dropout: 0.1
  heads: 4
  residual: true

readout:
  type: mean
  hidden_dim: 96

discriminator:
  hidden_dim: 96
  num_layers: 2

reconstruction:
  hidden_dim: 96
  num_layers: 2

fusion:
  hidden_dim: 96
  num_layers: 2
  entropy_reg_weight: 0.1

negative_mining:
  warmup_easy_epochs: 10
  transition_epochs: 20
  hard_phase_epochs: 70
  negative_ratio: 8
  memory_bank_size: 2048
  temperature: 0.2

samplers:
  context:
    type: khop
    k: 3
    sample_size: 64
  patch:
    type: random_walk
    walk_length: 4
    sample_size: 32
  attribute_aware: false
