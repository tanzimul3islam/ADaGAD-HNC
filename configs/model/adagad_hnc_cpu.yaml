name: adagad_hnc_cpu
encoder:
  type: gat
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1
  heads: 4
  residual: true

readout:
  type: mean
  hidden_dim: 64

discriminator:
  hidden_dim: 64
  num_layers: 2

reconstruction:
  hidden_dim: 64
  num_layers: 2

fusion:
  hidden_dim: 64
  num_layers: 2
  entropy_reg_weight: 0.1

negative_mining:
  warmup_easy_epochs: 10
  transition_epochs: 15
  hard_phase_epochs: 25
  negative_ratio: 4
  memory_bank_size: 1024
  temperature: 0.2

samplers:
  context:
    type: khop
    k: 2
    sample_size: 32
  patch:
    type: random_walk
    walk_length: 3
    sample_size: 16
  attribute_aware: false
